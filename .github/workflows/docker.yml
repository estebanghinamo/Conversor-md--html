name: Docker

on:
  pull_request:
    paths: ["Dockerfile", ".dockerignore", "src/**", "pyproject.toml", ".github/workflows/docker.yml"]
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  trivy:
    name: Build + Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t markforge:ci .
      - name: Smoke test
        run: |
          echo '# hola' | docker run --rm -i markforge:ci
          test "$(docker run --rm markforge:ci --version | wc -l)" -ge 1
      - name: Check non-root user
        run: test "$(docker run --rm --entrypoint id markforge:ci -u)" != "0"
      - uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: markforge:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
