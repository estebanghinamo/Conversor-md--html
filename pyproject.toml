[project]
name = "markforge"
version = "0.0.1"
description = "Biblioteca y CLI que transforma un subconjunto controlado de Markdown en HTML seguro."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
markforge = "markforge.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.169.0",
    "mutmut>=3.8.0",
    "mypy>=1.10",
    "pip-audit>=2.10.1",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
fuzz = [
    "atheris>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/markforge"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["markforge"]

[[tool.mypy.overrides]]
module = ["atheris"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mutmut]
# No corre en Windows: se ejecuta en .github/workflows/mutation.yml (ubuntu) o en WSL/Docker.
source_paths = ["src/markforge/"]
pytest_add_cli_args_test_selection = ["tests/unit", "tests/integration", "tests/property"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
also_copy = ["tests/fixtures"]

[tool.coverage.run]
branch = true
source = ["markforge"]

[tool.coverage.report]
fail_under = 90
show_missing = true
